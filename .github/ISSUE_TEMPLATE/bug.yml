name: Bug report
description: Something does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security issues here — see
        [SECURITY.md](../../SECURITY.md).
  - type: input
    id: version
    attributes:
      label: App version
      description: See "About" in the app, or the file name from the release.
      placeholder: "1.7.46"
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, Linux x86_64, Linux arm64, Android, iPhone or web app]
    validations: { required: true }
  - type: input
    id: server
    attributes:
      label: Server address
      description: Only the domain, no password or token.
      placeholder: "chat.example.com"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: If possible with the error message or an excerpt from the log.
    validations: { required: true }
  - type: checkboxes
    id: checks
    attributes:
      label: I have already checked
      options:
        - label: I am on the latest version.
        - label: The SHA-256 checksum of the installation matches.
        - label: The problem also occurs on a fresh account.
